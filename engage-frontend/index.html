<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Primary SEO -->
    <title>EngageSwap — Free Website Promotion & Traffic Exchange</title>
    <meta name="description" content="Promote your website for free and get real visitors. EngageSwap helps you grow traffic through mutual engagement — no bots, no ads, just real users." />
    <meta name="keywords" content="free website promotion, traffic exchange, get website visitors, SEO traffic, website marketing" />
    <meta name="robots" content="index,follow" />

    <!-- PWA / Theme -->
    <meta name="theme-color" content="#0f766e" />
    <meta name="application-name" content="EngageSwap" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/web-app-manifest-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/web-app-manifest-512x512.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="EngageSwap — Free Website Promotion & Traffic Exchange" />
    <meta property="og:description" content="Get real visitors, not bots. Campaigners promote free. Earners visit sites to earn coins. Timer + quiz verification ensures genuine engagement." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://engageswap.in/" />
    <meta property="og:site_name" content="EngageSwap" />
    <meta property="og:image" content="/web-app-manifest-512x512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EngageSwap — Free Website Promotion & Traffic Exchange" />
    <meta name="twitter:description" content="Promote your website for free and get real visitors through mutual engagement — no bots, no ads." />
    <meta name="twitter:image" content="/web-app-manifest-512x512.png" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "EngageSwap",
        "url": "https://engageswap.in/",
        "description": "Free website promotion & traffic exchange platform with quiz-verified, human engagement.",
        "inLanguage": "en",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://engageswap.in/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
